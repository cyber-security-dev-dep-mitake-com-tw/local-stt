name: Build team DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version shown in the app and DMG filename
        required: true
        default: 0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Show toolchain
        run: |
          uname -m
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test

      - name: Build ad-hoc signed DMG
        env:
          VERSION: ${{ steps.version.outputs.value }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUNDLE_ID: com.localstt.team
        run: ./scripts/build-team-dmg.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalSTT-${{ steps.version.outputs.value }}-team-unsigned
          path: |
            dist/LocalSTT-${{ steps.version.outputs.value }}-team-unsigned.dmg
            dist/LocalSTT-${{ steps.version.outputs.value }}-team-unsigned.dmg.sha256
          if-no-files-found: error

      - name: Create GitHub Release for tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/LocalSTT-$VERSION-team-unsigned.dmg" \
            "dist/LocalSTT-$VERSION-team-unsigned.dmg.sha256" \
            --title "LocalSTT $VERSION" \
            --notes "Unsigned team build. Install whisper-cpp and opencc with Homebrew before use. Gatekeeper may require right-click → Open."
